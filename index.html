<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* Scrollbar */
    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    /* Typing cursor animation */
    .typing-cursor::after {
      content: '▍';
      display: inline-block;
      animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Markdown prose styles for AI bubble */
    .prose-chat h1, .prose-chat h2, .prose-chat h3 { font-weight: 700; margin: 0.5rem 0 0.25rem; }
    .prose-chat h1 { font-size: 1.2rem; }
    .prose-chat h2 { font-size: 1.05rem; }
    .prose-chat h3 { font-size: 0.95rem; }
    .prose-chat p  { margin: 0.25rem 0; line-height: 1.6; }
    .prose-chat ul { list-style: disc; padding-left: 1.25rem; margin: 0.25rem 0; }
    .prose-chat ol { list-style: decimal; padding-left: 1.25rem; margin: 0.25rem 0; }
    .prose-chat li { margin: 0.1rem 0; }
    .prose-chat strong { font-weight: 700; }
    .prose-chat em { font-style: italic; }
    .prose-chat blockquote {
      border-left: 3px solid #94a3b8;
      padding-left: 0.75rem;
      color: #64748b;
      margin: 0.5rem 0;
      font-style: italic;
    }
    .prose-chat code:not(pre code) {
      background: #1e293b;
      color: #f8fafc;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
      font-family: 'Fira Code', 'Courier New', monospace;
    }
    .prose-chat pre {
      border-radius: 0.5rem;
      overflow: hidden;
      margin: 0.5rem 0;
      font-size: 0.82rem;
    }
    .prose-chat pre code {
      display: block;
      padding: 1rem;
      overflow-x: auto;
    }
    .prose-chat a { color: #3b82f6; text-decoration: underline; }
    .prose-chat hr { border-color: #e2e8f0; margin: 0.5rem 0; }
    .prose-chat table { border-collapse: collapse; width: 100%; font-size: 0.85em; margin: 0.5rem 0; }
    .prose-chat th, .prose-chat td { border: 1px solid #e2e8f0; padding: 0.35rem 0.6rem; text-align: left; }
    .prose-chat th { background: #f1f5f9; font-weight: 600; }
  </style>
</head>

<body class="h-full bg-gradient-to-br from-slate-100 to-blue-50 flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Error Banner -->
  <div id="error-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2
       bg-red-50 border border-red-300 text-red-700 text-sm px-4 py-3 rounded-xl shadow-lg max-w-sm w-full mx-auto">
    <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    <span id="error-text">Network error. Please try again.</span>
    <button onclick="hideError()" class="ml-auto text-red-400 hover:text-red-600">✕</button>
  </div>

  <!-- Chat Window -->
  <div class="w-full max-w-2xl h-full sm:h-[92vh] flex flex-col bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-600 px-4 sm:px-6 py-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7H4a7 7 0 017-7h1V5.73A2 2 0 0112 2zM4 15h16l-2 6H6l-2-6z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-white font-bold text-base sm:text-lg leading-tight">AI Chatbot</h1>
          <p class="text-blue-200 text-xs">Powered by Gemini</p>
        </div>
      </div>
      <!-- Clear History Button -->
      <button id="clear-btn" onclick="clearHistory()"
        class="flex items-center gap-1.5 text-white/70 hover:text-white text-xs sm:text-sm px-3 py-1.5
               border border-white/20 hover:border-white/50 rounded-lg transition-all duration-200 hover:bg-white/10"
        title="Clear chat history">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        <span class="hidden sm:inline">Clear</span>
      </button>
    </header>

    <!-- Chat Messages -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scroll-smooth">
      <!-- Empty state -->
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center text-slate-400 gap-3 py-16">
        <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center">
          <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-4 4z"/>
          </svg>
        </div>
        <div>
          <p class="font-semibold text-slate-500">Start a conversation</p>
          <p class="text-sm mt-1">Ask me anything — I support code, math, and more.</p>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="shrink-0 border-t border-slate-100 bg-slate-50 px-4 sm:px-6 py-3 sm:py-4">
      <!-- Validation message -->
      <p id="validation-msg" class="hidden text-xs text-red-500 mb-1.5">⚠ Please enter a message before sending.</p>

      <form id="chat-form" class="flex items-end gap-2 sm:gap-3">
        <div class="flex-1 relative">
          <textarea
            id="user-input"
            rows="1"
            maxlength="4000"
            placeholder="Message AI..."
            class="w-full resize-none border border-slate-200 rounded-xl px-4 py-3 pr-12 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   bg-white text-slate-800 placeholder-slate-400 transition-all duration-200
                   max-h-40 overflow-y-auto leading-relaxed"
          ></textarea>
          <span id="char-count" class="absolute bottom-2 right-3 text-xs text-slate-300 select-none pointer-events-none">0/4000</span>
        </div>
        <button type="submit" id="send-btn"
          class="shrink-0 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed
                 text-white rounded-xl w-11 h-11 flex items-center justify-center
                 transition-all duration-200 shadow-sm hover:shadow-md active:scale-95">
          <!-- Send icon -->
          <svg id="send-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
          <!-- Loading spinner -->
          <svg id="loading-icon" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        </button>
      </form>
      <p class="text-xs text-slate-300 mt-2 text-center">AI can make mistakes. Verify important information.</p>
    </footer>
  </div>

  <script>
    // ─── Marked.js config ───────────────────────────────────────────
    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true,
    });

    // ─── DOM refs ────────────────────────────────────────────────────
    const chatForm      = document.getElementById('chat-form');
    const userInput     = document.getElementById('user-input');
    const chatContainer = document.getElementById('chat-container');
    const emptyState    = document.getElementById('empty-state');
    const sendBtn       = document.getElementById('send-btn');
    const sendIcon      = document.getElementById('send-icon');
    const loadingIcon   = document.getElementById('loading-icon');
    const charCount     = document.getElementById('char-count');
    const validationMsg = document.getElementById('validation-msg');
    const errorBanner   = document.getElementById('error-banner');
    const errorText     = document.getElementById('error-text');

    let isStreaming = false;

    // ─── Char counter & auto-resize textarea ─────────────────────────
    userInput.addEventListener('input', () => {
      const len = userInput.value.length;
      charCount.textContent = `${len}/4000`;
      charCount.classList.toggle('text-red-400', len > 3800);
      validationMsg.classList.add('hidden');
      // auto grow
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
    });

    // Send on Enter (Shift+Enter = newline)
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isStreaming) chatForm.requestSubmit();
      }
    });

    // ─── Helpers ────────────────────────────────────────────────────
    function setLoading(loading) {
      isStreaming = loading;
      sendBtn.disabled = loading;
      userInput.disabled = loading;
      sendIcon.classList.toggle('hidden', loading);
      loadingIcon.classList.toggle('hidden', !loading);
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
      setTimeout(hideError, 6000);
    }

    function hideError() {
      errorBanner.classList.add('hidden');
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideEmptyState() {
      emptyState.classList.add('hidden');
    }

    function createBubble(isUser) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} gap-1`;

      const avatar = document.createElement('div');
      avatar.className = `text-xs text-slate-400 px-1 ${isUser ? 'text-right' : 'text-left'}`;
      avatar.textContent = isUser ? 'You' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = isUser
        ? 'max-w-[85%] sm:max-w-[80%] bg-blue-600 text-white rounded-2xl rounded-br-sm px-4 py-2.5 text-sm leading-relaxed shadow-sm'
        : 'max-w-[95%] sm:max-w-[85%] bg-slate-100 text-slate-800 rounded-2xl rounded-bl-sm px-4 py-2.5 text-sm shadow-sm prose-chat';

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatContainer.appendChild(wrapper);
      scrollToBottom();

      return bubble;
    }

    // ─── Clear history ───────────────────────────────────────────────
    function clearHistory() {
      // Remove all message wrappers (everything except the empty-state div)
      const messages = chatContainer.querySelectorAll('div.flex.flex-col');
      messages.forEach(el => el.remove());
      emptyState.classList.remove('hidden');
    }

    // ─── Form submit ─────────────────────────────────────────────────
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const message = userInput.value.trim();
      if (!message) {
        validationMsg.classList.remove('hidden');
        userInput.focus();
        return;
      }
      validationMsg.classList.add('hidden');

      hideEmptyState();

      // User bubble
      const userBubble = createBubble(true);
      userBubble.textContent = message;

      userInput.value = '';
      userInput.style.height = 'auto';
      charCount.textContent = '0/4000';
      setLoading(true);

      // AI bubble
      const aiBubble = createBubble(false);
      aiBubble.classList.add('typing-cursor');
      let rawText = '';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s timeout

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`Server error: ${response.status} ${response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          rawText += decoder.decode(value, { stream: true });
          // Render markdown on every chunk
          aiBubble.innerHTML = marked.parse(rawText);
          // Re-apply syntax highlighting to new code blocks
          aiBubble.querySelectorAll('pre code').forEach(block => {
            if (!block.dataset.highlighted) {
              hljs.highlightElement(block);
              block.dataset.highlighted = 'true';
            }
          });
          scrollToBottom();
        }

      } catch (err) {
        if (err.name === 'AbortError') {
          showError('Request timed out. The server took too long to respond.');
          rawText += '\n\n_[Response timed out]_';
        } else {
          showError(`Network error: ${err.message}`);
          rawText += '\n\n_[Failed to load response]_';
        }
        aiBubble.innerHTML = marked.parse(rawText);
      } finally {
        aiBubble.classList.remove('typing-cursor');
        setLoading(false);
        userInput.focus();
      }
    });
  </script>
</body>
</html>
