services:
  - type: web
    name: ai-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # must be set manually in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.0
    autoDeploy: true
